name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevCollective/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: DevCollective/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Jest)
        run: npx jest --ci

      - name: Production build (Vite + SSR prerender)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevCollective/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: DevCollective/backend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check and compile (tsc)
        run: npm run build
